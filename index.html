<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoJocharm 星空主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Star Background -->
  <div class="star-background"></div>

  <!-- Floating Planets Container -->
  <div id="planets-container"></div>

  <!-- Home Section -->
  <section class="section section-home">
    <!-- Floating Texts Container -->
    <div id="floating-texts-container"></div>

    <!-- Profile Header -->
    <div class="profile-container" id="profileTrigger">
      <div class="avatar-wrapper">
        <div class="avatar">
          <img id="avatar-img" src="" alt="Avatar" />
        </div>
      </div>
      <h1 class="profile-name" id="profile-name"></h1>
    </div>

    <!-- Scroll Arrow -->
    <a href="#page2" class="scroll-arrow">
      <div class="scroll-arrow-content">
        <span class="scroll-hint">探索更多</span>
        <svg class="scroll-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
        </svg>
      </div>
    </a>
  </section>

  <!-- Page 2: Bento Modules -->
  <section id="page2" class="section">
    <div class="section-content" id="bento-sections-container">
      <!-- Sections will be dynamically inserted here -->
    </div>
  </section>

  <!-- Dialog Modal -->
  <div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog-content">
      <button class="dialog-close" id="dialogClose">&times;</button>
      
      <div class="dialog-section">
        <h3 class="dialog-title">关注公众号</h3>
        <div class="qr-code-wrapper">
          <img id="wechat-qrcode" src="" alt="公众号二维码" />
        </div>
        <div class="wechat-info">
          <span class="wechat-name" id="wechat-name"></span>
          <button class="btn btn-copy" id="copyBtn">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <span id="copyText">一键复制</span>
          </button>
        </div>
      </div>

      <div>
        <a id="bilibili-link" href="https://space.bilibili.com/" target="_blank" rel="noopener noreferrer" class="btn btn-bilibili">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
          点击进入B站主页 →
        </a>
      </div>
    </div>
  </div>

  <script>
    // Load config and render page
    let config = null;

    async function loadConfig() {
      try {
        const response = await fetch('config.json');
        config = await response.json();
        renderPage();
      } catch (error) {
        console.error('Failed to load config:', error);
      }
    }

    function renderPage() {
      if (!config) return;

      // Render profile
      document.getElementById('avatar-img').src = config.profile.avatar;
      document.getElementById('avatar-img').alt = config.profile.name;
      document.getElementById('profile-name').textContent = config.profile.name;
      document.getElementById('wechat-qrcode').src = config.profile.wechatQrCode;
      document.getElementById('wechat-name').textContent = config.profile.wechatName;
      document.getElementById('bilibili-link').href = config.profile.bilibiliUrl;

      // Render floating planets
      const planetsContainer = document.getElementById('planets-container');
      const planetConfigs = [
        { size: 80, left: '10%', top: '15%', colors: ['#60a5fa', '#3b82f6', '#2563eb'], delay: 0, duration: 8 },
        { size: 64, right: '15%', top: '25%', colors: ['#f472b6', '#ec4899', '#db2777'], delay: 1, duration: 10 },
        { size: 96, left: '80%', bottom: '30%', colors: ['#fb923c', '#f97316', '#ea580c'], delay: 2, duration: 9 },
        { size: 40, left: '5%', top: '40%', colors: ['#34d399', '#10b981', '#059669'], delay: 0.5, duration: 7 }
      ];

      planetConfigs.forEach(planet => {
        const el = document.createElement('div');
        el.className = 'floating-planet';
        el.style.width = planet.size + 'px';
        el.style.height = planet.size + 'px';
        if (planet.left) el.style.left = planet.left;
        if (planet.right) el.style.right = planet.right;
        if (planet.top) el.style.top = planet.top;
        if (planet.bottom) el.style.bottom = planet.bottom;
        el.style.background = `linear-gradient(135deg, ${planet.colors.join(', ')})`;
        el.style.boxShadow = `0 0 50px ${planet.colors[0]}99, 0 0 80px ${planet.colors[0]}4D`;
        el.style.setProperty('--duration', planet.duration + 's');
        el.style.setProperty('--delay', planet.delay + 's');
        planetsContainer.appendChild(el);
      });

      // Render floating texts
      const textsContainer = document.getElementById('floating-texts-container');
      config.floatingTexts.forEach(text => {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.textContent = text.text;
        el.style.color = text.color;
        if (text.left) el.style.left = text.left;
        if (text.right) el.style.right = text.right;
        if (text.top) el.style.top = text.top;
        if (text.bottom) el.style.bottom = text.bottom;
        el.style.setProperty('--rotation', `rotate(${text.rotation}deg)`);
        el.style.setProperty('--duration', text.duration + 's');
        el.style.setProperty('--delay', text.delay + 's');
        el.style.fontSize = text.fontSize === 'text-2xl md:text-3xl' ? '1.5rem' :
                           text.fontSize === 'text-3xl md:text-4xl' ? '2rem' :
                           text.fontSize === 'text-xl md:text-2xl' ? '1.25rem' : '1.5rem';
        textsContainer.appendChild(el);
      });

      // Render bento sections
      const sectionsContainer = document.getElementById('bento-sections-container');
      config.sections.forEach((section, sectionIndex) => {
        const sectionEl = document.createElement('div');
        sectionEl.style.marginBottom = '6rem';

        const titleEl = document.createElement('h2');
        titleEl.className = 'section-title';
        titleEl.textContent = section.title;
        sectionEl.appendChild(titleEl);

        const gridEl = document.createElement('div');
        gridEl.className = 'bento-grid';

        section.modules.forEach(module => {
          const moduleEl = document.createElement('a');
          moduleEl.href = module.link || '#';
          moduleEl.target = '_blank';
          moduleEl.rel = 'noopener noreferrer';
          moduleEl.className = `bento-module bento-${module.type}`;
          moduleEl.style.borderColor = module.borderColor;
          moduleEl.style.boxShadow = `0 0 20px ${module.borderColor.replace('/50', '/30')}, 0 0 40px ${module.borderColor.replace('/50', '/15')}`;

          // Hover effects
          moduleEl.addEventListener('mouseenter', function() {
            this.style.borderColor = module.borderColor.replace('/50', '/80');
            this.style.boxShadow = `0 0 30px ${module.borderColor.replace('/50', '/50')}, 0 0 60px ${module.borderColor.replace('/50', '/30')}, 0 10px 40px rgba(0,0,0,0.3)`;
          });
          moduleEl.addEventListener('mouseleave', function() {
            this.style.borderColor = module.borderColor;
            this.style.boxShadow = `0 0 20px ${module.borderColor.replace('/50', '/30')}, 0 0 40px ${module.borderColor.replace('/50', '/15')}`;
          });

          const imgEl = document.createElement('img');
          imgEl.src = module.image;
          imgEl.alt = module.title;
          imgEl.className = 'bento-image';

          const overlayEl = document.createElement('div');
          overlayEl.className = 'bento-overlay';

          const contentEl = document.createElement('div');
          contentEl.className = 'bento-content';

          const moduleTitleEl = document.createElement('h3');
          moduleTitleEl.className = 'bento-title';
          moduleTitleEl.textContent = module.title;

          const descEl = document.createElement('p');
          descEl.className = 'bento-description';
          descEl.textContent = module.description;

          contentEl.appendChild(moduleTitleEl);
          contentEl.appendChild(descEl);
          moduleEl.appendChild(imgEl);
          moduleEl.appendChild(overlayEl);
          moduleEl.appendChild(contentEl);
          gridEl.appendChild(moduleEl);
        });

        sectionEl.appendChild(gridEl);
        sectionsContainer.appendChild(sectionEl);
      });

      // Add text box at the end
      if (config.footerText) {
        const textBoxEl = document.createElement('div');
        textBoxEl.className = 'text-box';
        const textP = document.createElement('p');
        textP.textContent = config.footerText;
        textBoxEl.appendChild(textP);
        sectionsContainer.appendChild(textBoxEl);
      }
    }

    // Dialog functionality
    const profileTrigger = document.getElementById('profileTrigger');
    const dialogOverlay = document.getElementById('dialogOverlay');
    const dialogClose = document.getElementById('dialogClose');
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');

    profileTrigger.addEventListener('click', () => {
      dialogOverlay.classList.add('active');
    });

    dialogClose.addEventListener('click', () => {
      dialogOverlay.classList.remove('active');
    });

    dialogOverlay.addEventListener('click', (e) => {
      if (e.target === dialogOverlay) {
        dialogOverlay.classList.remove('active');
      }
    });

    let copied = false;
    copyBtn.addEventListener('click', async () => {
      if (!config) return;
      try {
        await navigator.clipboard.writeText(config.profile.wechatName);
        copied = true;
        copyText.textContent = '已复制';
        setTimeout(() => {
          copied = false;
          copyText.textContent = '一键复制';
        }, 2000);
      } catch (err) {
        console.error('复制失败:', err);
      }
    });

    // Smooth scroll
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Initialize
    loadConfig();
  </script>
</body>
</html>
